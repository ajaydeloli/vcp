weights:
  trend_template: 0.25
  stage: 0.10
  relative_strength: 0.20
  vcp_quality: 0.30
  volume_supply_demand: 0.05
  # Deliberately 0, not just "currently unevaluated". Fundamentals are a
  # qualifier/filter on top of the technical setup (PROJECT-DESIGN.md §6.6),
  # not a blended input to it: bad or missing fundamentals data should never
  # be able to silently move a symbol's technical ranking. The fundamentals
  # engine still computes and persists fundamentals_score/regime/flags for
  # display and for use as a separate filter -- it's excluded from the
  # composite math specifically, via this weight, not by leaving it
  # unimplemented. Promoting it into the composite later (once backtested
  # to actually add value) is this one number changing, nothing else.
  fundamentals: 0.0

gates:
  trend_template_min_passes: 6
  relative_strength_min: 70

# Maps a stored market_stages_daily stage (1-4) to a 0-100 sub-score. Stage 2
# (advancing) is the only stage Minervini actually wants to be buying in.
stage_scores:
  1: 50
  2: 100
  3: 25
  4: 0

relative_strength:
  # Added on top of the raw 1-99 rating when the RS line makes a new high
  # before price does (design doc §6.3) -- a leading signal worth a small
  # bonus, capped so the component score never exceeds 100.
  new_high_bonus: 5

# How much of the VCP Pattern Quality component comes from the weekly
# structure itself (contraction count/decay, volume dry-up, base length --
# all read from the persisted vcp_results_weekly booleans) versus the daily
# entry-confirmation signals (tight closes, pivot proximity, breakout).
vcp_component_weights:
  structure: 0.70
  daily_confirmation: 0.30

volume:
  # up_down_volume_ratio is clipped to this range and rescaled to 0-100
  # before the accumulation/spike bonuses are added.
  ratio_floor: 0.5
  ratio_ceiling: 2.0
  accumulation_bonus: 15
  spike_bonus: 15

# VCP gate thresholds (contraction_tolerance, volume_decay_min/max,
# min/max contractions, base_length_min/max_weeks) are NOT duplicated here.
# They live in config/vcp.yaml, which is what sepa_scanner/analytics/vcp_detector.py
# actually reads. When sepa_scanner/scoring/scorer.py is implemented, it should
# load those thresholds from vcp.yaml rather than keeping a second copy here --
# two copies previously existed and could silently drift apart.
