[project]
name = "sepa-scanner"
version = "0.1.0"
description = "Local-first NSE VCP/SEPA screening and rating engine"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "kiteconnect>=5.0",
    "nse-xbrl>=0.1.1",
    "pandas>=2.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "requests>=2.28",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.115", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sepa_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
