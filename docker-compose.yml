services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn sepa_scanner.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - market_data:/app/data
  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
volumes:
  market_data:
  frontend_node_modules:
